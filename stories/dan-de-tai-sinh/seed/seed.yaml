plot_seed:
  opening_situation: "Ở kiếp trước, Tạ Trường An chuẩn bị đột phá một đại cảnh giới quan trọng sau khi hoàn thành một loại đan dược đủ làm thay đổi cán cân giữa các thế lực. Trong thời khắc phòng bị yếu nhất, trận pháp hộ đạo bị người bên trong sửa một mắt trận và một nhóm sát thủ dùng thủ đoạn chuyên khắc thần hồn đánh úp."
  inciting_incident: "Hắn tỉnh lại nhiều năm sau trong thân xác một thiếu niên cùng tên vừa bị thương nặng sau tranh chấp trong ngoại môn. Khi kiểm tra cơ thể, hắn phát hiện ám thương có dấu vết của một loại dược độc rất hiếm liên quan gián tiếp tới thủ pháp từng xuất hiện trước vụ ám sát kiếp trước."
  first_major_goal: "Chữa ám thương, giữ vị trí trong tông môn, kiếm lò và linh dược đầu tiên, đồng thời che giấu trình độ đan đạo thật để tránh bị chú ý quá sớm."
  early_antagonistic_force: "Một mạng lưới lợi ích trong tông môn cấu kết với thương hội bên ngoài để thao túng linh dược và suất vào bí cảnh; họ không biết main trọng sinh nhưng nhanh chóng nhận ra hắn đang phá hỏng các nguồn lợi của mình."
  long_term_direction: "Từ ngoại môn, main bước qua thi đấu tông môn, tranh phong liên tông và bí cảnh; danh tiếng đan đạo tăng dần kéo hắn vào cuộc chơi giữa Đan Minh, đại tông và một tổ chức bí mật có liên hệ với cái chết kiếp trước. Càng điều tra, hắn càng phát hiện vụ ám sát không nhằm cướp một đan phương đơn lẻ mà để ngăn một bí mật về con đường vượt qua giới hạn cảnh giới bị công khai."
  ending_direction: "Main và đồng minh phá được kế hoạch cuối của tổ chức phản diện bằng cách đánh sập mạng lưới tài nguyên, tình báo và trận pháp trước khi đối đầu thủ lĩnh. Main vượt qua giới hạn kiếp trước nhưng không trở thành kẻ cô độc; hắn cùng nữ chính lập một đạo thống/đan viện độc lập, giữ quan hệ với những bằng hữu từng đồng hành. Couple thành đôi và câu chuyện khép lại theo hướng viên mãn."
  major_scenes_user_wants:
    - "Main lần đầu luyện một lò đan bằng thiết bị tồi, phải sửa phương pháp theo điều kiện thực tế thay vì dùng kỹ thuật kiếp trước nguyên xi."
    - "Thi đấu tông môn: main gặp một thiên kiêu khắc chế trực tiếp lối đánh của mình và phải thay đổi chiến thuật giữa trận."
    - "Thi đấu liên tông: một đối thủ mạnh nhận ra main đang giấu bài và chủ động ép hắn lộ tài nguyên dự phòng trước trận quyết định."
    - "Bí cảnh: main và nữ chính bị tách khỏi đội, buộc phải hợp tác qua khu vực nguy hiểm có độc chướng, trận pháp cổ và truy binh."
    - "Bí cảnh: xuất hiện cơ duyên lớn nhưng lấy nó đồng nghĩa bỏ lỡ việc cứu một người hoặc mất lợi thế chiến lược; main phải lựa chọn và chịu hậu quả."
    - "Trận thập tử nhất sinh: phản diện chuẩn bị một bẫy dựa trên chính thói quen dùng đan dược của main, khiến hắn trúng kế và gần chết."
    - "Main thắng một thiên kiêu mạnh hơn bằng cách khiến đối phương tiêu hao sai tài nguyên và bước vào địa hình bất lợi, không phải bằng một chiêu bí mật áp đảo."
    - "Một lần main cố tình thua hoặc nhường một lợi ích nhỏ để bảo toàn bí mật và đổi lấy vị thế tốt hơn về sau."
    - "Đối đầu cuối: trước khi giao chiến, hai bên đã phá kế hoạch của nhau nhiều vòng; chiến thắng cần cả đồng minh, thông tin đúng và lựa chọn hy sinh lợi ích cá nhân."
  twists_user_wants:
    - "Người trực tiếp sửa trận pháp kiếp trước không phải thủ lĩnh phản diện mà là người bị ép bằng một con tin hoặc món nợ, khiến sự thật phức tạp hơn báo thù đơn tuyến."
    - "Một nhân vật tưởng là phản diện ở tông môn đầu thực chất đang lần theo cùng mạng lưới nhưng dùng phương pháp tàn nhẫn hơn."
    - "Thế lực phản diện sớm nhận ra có một đan sư bí ẩn đứng sau main, nhưng kết luận sai rằng đó là một lão quái ẩn cư; main tận dụng hiểu lầm này trong một giai đoạn rồi phải trả giá khi đối thủ kiểm chứng."
    - "Một phần ký ức thiếu hụt của main chứa chính sai lầm chiến lược của hắn ở kiếp trước; hắn từng vô tình tạo điều kiện cho phản diện lớn mạnh."
  twists_to_avoid:
    - "Tất cả đồng minh đều phản bội."
    - "Nữ chính là thủ lĩnh phản diện bí mật."
    - "Main thực ra là thiên mệnh chi tử được thế giới sắp đặt mọi cơ duyên."
    - "Kết thúc hóa ra toàn bộ hành trình là ảo cảnh hoặc giấc mơ."

factions_seed:
  must_have_factions:
    - "Tông môn khởi đầu của main, nội bộ có phe phái nhưng không hoàn toàn mục nát."
    - "Ít nhất ba tông phái đối thủ với hệ chiến đấu và văn hóa khác nhau để phục vụ arc thi đấu."
    - "Một Đan Minh hoặc tổ chức đan sư vừa là nơi trao đổi tri thức vừa là chiến trường lợi ích."
    - "Một thương hội lớn kiểm soát luồng linh dược và tin tức."
    - "Một thế lực phản diện ngầm hoạt động theo mạng lưới phân tầng, các nhánh chỉ biết một phần kế hoạch để chống lộ bí mật."
  faction_flavor: "Không có phe nào toàn thiện hoặc toàn ngu; mỗi thế lực có lợi ích, giới hạn thông tin và lý do hợp tác/xung đột riêng."
  notes: "Phản diện chủ lực phải có người chỉ huy biết thu thập dữ kiện, xây giả thuyết, thử nghiệm phản ứng của main và thay chiến thuật khi giả thuyết sai."

romance_seed:
  enabled: true
  importance: "secondary_but_meaningful"
  pairing_direction: "Một nữ tu cùng thế hệ thiên về kiếm đạo hoặc trận đạo, lý trí, độc lập và có mục tiêu cá nhân. Ban đầu hai người cạnh tranh hoặc hợp tác vì lợi ích, sau nhiều lần cùng vượt nguy hiểm mới hình thành tin tưởng và tình cảm. Nữ chính phải có năng lực mà main thật sự cần, đồng thời có lúc cứu hoặc sửa sai cho main."
  harem: false
  constraints:
    - "Một couple chính duy nhất."
    - "Không yêu từ cái nhìn đầu tiên."
    - "Không dùng hiểu lầm tình cảm kéo dài chỉ để tạo drama."
    - "Không biến nữ chính thành người phụ thuộc vào tài nguyên của main."
    - "Tình cảm phát triển qua hành động, lựa chọn và niềm tin, không qua lời tuyên bố đột ngột."
    - "Happy ending rõ ràng cho couple."
  notes: "Romance không được nuốt plot chính nhưng phải có progression thật qua các arc, đặc biệt trong bí cảnh và giai đoạn đối đầu thế lực lớn."

tone_seed:
  narration_pov: "third_limited"
  preferred_pacing: "nhanh vừa, ưu tiên causal progression; có khoảng lắng sau các đoạn tranh đấu lớn để state và quan hệ thay đổi tự nhiên"
  preferred_dialogue_density: "trung bình; thoại dùng để mặc cả, dò xét, bộc lộ quan hệ và tạo lựa chọn, tránh nhân vật giải thích kế hoạch cho nhau vô cớ"
  humor_level: "thấp đến trung bình, đến từ tương tác nhân vật và chênh lệch nhận thức hơn là gag"
  brutality_level: "trung bình đến cao trong sinh tử chiến; thương tích và hậu quả phải có trọng lượng"
  philosophical_depth: "trung bình; tập trung vào cái giá của truy cầu đỉnh cao, niềm tin, cô độc và giá trị của việc truyền thừa"
  prose_feel_notes: "Tiên hiệp Việt tự nhiên, có không khí cổ phong nhưng không convert-like. Chiến đấu rõ không gian, quyết định và hậu quả. Suy luận chiến thuật chỉ xuất hiện khi nó thay đổi hành động, không biến thành báo cáo phân tích."
  phrases_or_tics_to_avoid:
    - "không khỏi"
    - "hiển nhiên"
    - "phải biết rằng"
    - "nói thì chậm mà xảy ra thì nhanh"
    - "khóe miệng cong lên một độ cong"
    - "hít sâu một hơi khí lạnh"
    - "liên tục giải thích đối thủ ngu ở đâu sau khi đã thắng"

example_calibration:
  mode: "dynamic_examples"
  use_framework_bootstrap_until_project_examples_exist: true
  prefer_user_approved_project_examples: true
  max_examples_per_scene: 3
  notes: "Examples calibrate prose feel only; they never define plot or scene structure."

content_boundaries:
  prohibited_content:
    - "tình dục miêu tả trực diện"
    - "bạo lực tình dục"
  violence_notes: "Cho phép chiến đấu sinh tử, thương tích nặng và cái chết khi cần cho plot, nhưng không sa vào gore kéo dài để gây sốc."
  romance_notes: "Tình cảm trưởng thành, tập trung vào đồng hành, tin tưởng và lựa chọn; có thể có thân mật nhẹ nhưng không explicit."
  other_boundaries:
    - "Không dùng bi kịch với nữ chính chỉ để kích hoạt sức mạnh hoặc động lực báo thù cho main."

production:
  batch_size: 5
  auto_run_batch: true
  require_continuity_check: true
  prose_edit_mode: "light_example_driven"
  final_filename_format: "Chương {chapter}: {title}.txt"
  branch_format: "story/{slug}"

open_questions:
  user_wants_ai_to_decide:
    - "Tên chính thức cuối cùng của truyện."
    - "Tên và chi tiết các tông môn, Đan Minh, thương hội và thế lực phản diện."
    - "Tên nữ chính và hệ tu luyện cụ thể của nàng."
    - "Chi tiết từng cảnh giới, công pháp, linh hỏa, đan phương và bí cảnh."
    - "Cấu trúc arc cụ thể, số chương từng arc và thứ tự các lần reveal âm mưu."
    - "Danh tính thủ lĩnh phản diện và động cơ cuối cùng, miễn tuân thủ hướng mưu đấu thông minh của seed."
  user_must_decide: []
