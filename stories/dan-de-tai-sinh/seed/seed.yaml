    - "Nữ chính tương lai: ban đầu là một đối thủ/đồng hành có mục tiêu riêng, không biết bí mật trọng sinh."
  notes: "Main có thể thắng thiên kiêu nhờ chuẩn bị, đọc trận, đan dược đúng lúc và khai thác điểm yếu, nhưng không được biến tri thức kiếp trước thành khả năng biết mọi bí mật hoặc đoán đúng mọi kế hoạch."

