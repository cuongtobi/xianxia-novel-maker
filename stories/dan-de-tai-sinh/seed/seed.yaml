  cheat_constraints: "Ký ức không thể thay thế cảnh giới thần hồn, linh lực, lò luyện, linh hỏa và linh dược. Đan phương cấp cao thường không thể luyện ở cảnh giới thấp. Một số tri thức về thế giới đã thay đổi sau thời gian giữa hai kiếp, và ký ức quanh thời điểm bị ám hại có khoảng trống do thần hồn bị tổn thương. Mỗi lần cưỡng ép luyện đan hoặc dùng thủ đoạn vượt cấp đều có nguy cơ phản phệ thật sự."
