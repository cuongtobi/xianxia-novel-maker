creative_intent:
  one_sentence_premise: "Một Đan Đế bị ám hại ngay lúc đột phá đại cảnh giới, trọng sinh vào thân xác một thiếu niên tư chất tầm thường và dùng ký ức luyện đan của kiếp trước để từng bước tu luyện, tranh cơ duyên, đấu thiên kiêu và truy ra thế lực đã giết mình."
  core_hook: "Main sở hữu tri thức của Đan Đế nhưng không có tu vi tương xứng; mỗi lần vượt cấp đều phải biến kiến thức luyện đan, hiểu biết dược tính và khả năng chuẩn bị thành lợi thế chiến thuật thay vì nghiền ép đối thủ bằng cảnh giới."
  reading_experience:
    primary_mood: "sảng khoái có tính toán, căng thẳng khi tranh đấu"
    secondary_moods:
      - "bí ẩn"
      - "mưu đấu"
      - "nhiệt huyết tông môn"
      - "sinh tử hiểm cảnh"
      - "tình cảm phát triển chậm"
  what_makes_this_story_different: "Trọng tâm không nằm ở việc main biết trước mọi thứ, mà ở việc tri thức Đan Đế phải được chuyển hóa thành tài nguyên, phương án và quyết định đúng trong điều kiện thiếu linh dược, thiếu lò tốt, thân thể yếu và đối thủ biết thích nghi. Phản diện chủ lực có năng lực suy luận, kiểm chứng thông tin và chủ động thay đổi kế hoạch khi main phá cục."
  must_have_elements:
    - "Arc thi đấu tông môn với nhiều đối thủ có phong cách chiến đấu khác nhau, main không được thắng chỉ nhờ chênh lệch cảnh giới."
    - "Arc bí cảnh tranh cơ duyên, có khám phá di tích, tranh đoạt tài nguyên và ít nhất một lựa chọn đánh đổi thật sự."
    - "Ít nhất một trận chiến thập tử nhất sinh khiến main phải dùng toàn bộ chuẩn bị, chịu thương tích nghiêm trọng và trả giá rõ ràng để sống sót."
    - "Có nhiều thiên kiêu thuộc các tông phái khác nhau; một số là đối thủ, một số trở thành đồng minh hoặc người tôn trọng main sau va chạm."
    - "Thế lực phản diện thông minh, có hệ thống tình báo, biết thử bẫy, tung thông tin giả, che dấu mục tiêu và rút lui khi bất lợi."
    - "Main phải có lúc đoán sai, bị ép đổi kế hoạch hoặc chịu tổn thất vì đối thủ cũng biết suy luận."
    - "Đan đạo phải tham gia trực tiếp vào progression: chữa thương, cải tạo căn cơ, đổi tài nguyên, phá độc, chuẩn bị chiến đấu và xây quan hệ."
    - "Có một couple chính, tình cảm phát triển qua đồng hành, tin tưởng và cùng vượt hiểm cảnh."
    - "Happy ending: âm mưu chính được giải quyết, main và nữ chính ở bên nhau, con đường tu hành vẫn rộng mở nhưng xung đột trung tâm đã khép lại."
  avoid_elements:
    - "Main vô địch ngay từ đầu hoặc liên tục nghiền ép đối thủ cao hơn nhiều đại cảnh giới mà không trả giá."
    - "Phản diện ngu hóa chỉ để main thể hiện thông minh."
    - "Lặp lại mô-típ thiếu gia kiêu ngạo gây sự, bị vả mặt rồi xuất hiện thiếu gia mạnh hơn."
    - "Cơ duyên tự rơi vào tay main không cần lựa chọn, nguy hiểm hoặc cạnh tranh."
    - "Luyện đan thành nút bấm giải quyết mọi vấn đề không cần linh dược, thời gian, lò, hỏa hoặc trình độ thần hồn."
    - "Hậu cung."
    - "Nữ chính chỉ tồn tại để được cứu hoặc làm phần thưởng tình cảm."
    - "Đột phá liên tục không có tích lũy, bottleneck hoặc hậu quả."
  inspiration_notes:
    - "Giữ cảm giác tiên hiệp truyền thống: tông môn, bí cảnh, đan đạo, tranh cơ duyên, cảnh giới và thế lực đa tầng."
    - "Ưu tiên đấu trí thực dụng trong chiến đấu và tranh tài nguyên hơn là mưu kế quá phức tạp chỉ để gây bất ngờ."
  originality_constraints:
    do_not_copy_specific_plot: true
    do_not_copy_specific_characters: true
    do_not_copy_specific_prose: true
    notes: "Chỉ dùng trope Đan Đế trọng sinh như điểm xuất phát; nhân vật, thế lực, bí cảnh, công pháp, đan phương, âm mưu và diễn biến phải là sáng tạo riêng của project."

protagonist_seed:
