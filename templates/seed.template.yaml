# Story Seed Template — v4.0
# Seed captures user creative intent. It is not runtime state and not a writing checklist.

meta:
  working_title: ""
  slug: ""
  language: "vi"
  genres:
    - "tiên hiệp"
    - "tu tiên"
  subgenres: []
  target_length_chapters: 500
  chapter_length_words:
    min: 2500
    target: 3200
    max: 4200
  rating: ""

creative_intent:
  one_sentence_premise: ""
  core_hook: ""
  reading_experience:
    primary_mood: ""
    secondary_moods: []
  what_makes_this_story_different: ""
  must_have_elements: []
  avoid_elements: []
  inspiration_notes: []
  originality_constraints:
    do_not_copy_specific_plot: true
    do_not_copy_specific_characters: true
    do_not_copy_specific_prose: true
    notes: ""

protagonist_seed:
  name: ""
  gender: ""
  starting_age: null
  origin: ""
  starting_status: ""
  surface_goal: ""
  deeper_need: ""
  personality_keywords: []
  strengths: []
  flaws: []
  special_trait_or_cheat: ""
  cheat_constraints: ""
  initial_relationships: []
  notes: ""

world_seed:
  world_scale: ""
  starting_region: ""
  civilization_flavor: ""
  cultivation_flavor: ""
  supernatural_density: ""
  mortal_cultivator_relationship: ""
  important_world_ideas: []
  forbidden_world_ideas: []
  notes: ""

cultivation_seed:
  desired_feel: ""
  known_realms: []
  special_rules: []
  protagonist_path: ""
  resource_pressure: ""
  breakthrough_style: ""
  power_ceiling_hint: ""
  notes: ""

plot_seed:
  opening_situation: ""
  inciting_incident: ""
  first_major_goal: ""
  early_antagonistic_force: ""
  long_term_direction: ""
  ending_direction: ""
  major_scenes_user_wants: []
  twists_user_wants: []
  twists_to_avoid: []

factions_seed:
  must_have_factions: []
  faction_flavor: ""
  notes: ""

romance_seed:
  enabled: false
  importance: "none"
  pairing_direction: ""
  harem: false
  constraints: []
  notes: ""

tone_seed:
  narration_pov: "third_limited"
  preferred_pacing: ""
  preferred_dialogue_density: ""
  humor_level: ""
  brutality_level: ""
  philosophical_depth: ""
  prose_feel_notes: ""
  phrases_or_tics_to_avoid: []

example_calibration:
  mode: "dynamic_examples"
  use_framework_bootstrap_until_project_examples_exist: true
  prefer_user_approved_project_examples: true
  max_examples_per_scene: 3
  notes: "Examples calibrate prose feel only; they never define plot or scene structure."

content_boundaries:
  prohibited_content: []
  violence_notes: ""
  romance_notes: ""
  other_boundaries: []

production:
  batch_size: 5
  auto_run_batch: true
  require_continuity_check: true
  prose_edit_mode: "light_example_driven"
  final_filename_format: "Chương {chapter}: {title}.txt"
  branch_format: "story/{slug}"

open_questions:
  user_wants_ai_to_decide: []
  user_must_decide: []
