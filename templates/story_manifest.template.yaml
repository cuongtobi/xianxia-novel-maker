# Story Manifest Template
# File đích: stories/<slug>/manifest.yaml

story:
  slug: ""
  title: ""
  branch: "story/<slug>"
  status: "genesis"
  language: "vi"

pipeline:
  version: "3.1"
  batch_size: 5
  batch_workflow: "docs/BATCH_5_WORKFLOW.md"
  story_promise_spec: "docs/READER_EXPERIENCE_SYSTEM.md"
  reference_style_spec: "docs/REFERENCE_STYLE_SYSTEM.md"
  reference_style_profile: "docs/reference_profiles/TIEN_NGHICH_HIGH_LEVEL_STYLE.md"
  controllers:
    - story_promise
  current_stage: "seed"
  last_finalized_chapter: 0
  current_arc: "arc_001"
  next_chapter: 1
  qc_required: true
  qc_modes:
    - continuity
    - story_promise
    - style_fingerprint
  rewrite_required: true
  story_promise_required: true
  reader_experience_required: true
  reference_style_enabled: true
  reference_style_mode: "high_level_style_dna_only"

artifacts:
  seed: "seed/seed.yaml"
  story_bible: "bible/story_bible.md"
  style_bible: "bible/style_bible.md"
  characters_bible: "bible/characters_bible.md"
  master_outline: "outline/master_outline.md"
  current_arc_outline: "outline/arcs/arc_001.md"
  current_state: "memory/current_state.md"
  reader_experience: "memory/reader_experience.md"

locks:
  canon_initialized: false
  style_initialized: false
  characters_initialized: false
  story_promises_initialized: false
  master_outline_initialized: false
  opening_arc_initialized: false
  memory_initialized: false
  reader_experience_initialized: false
  reference_style_adapted: false

production:
  target_chapters: null
  chapter_words_target: null
  last_batch_audit: null
  next_batch_start: 1

completion_gate:
  verify_artifacts_before_reporting_complete: true
  require_batch_audit: true
  require_reader_experience_update: true
  require_story_promise_review: true
  require_reference_style_adaptation_when_enabled: true

migration:
  from_version: null
  migrated_to: null
  legacy_cutoff_chapter: 0
  migration_baseline: null
  prior_batch_size: null
  batch_size_migrated_at_chapter: null
  retired_controller_artifacts_preserved: true

notes:
  framework_migration: ""
  user_constraints: []
